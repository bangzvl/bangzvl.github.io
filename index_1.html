    <script>
      // Kode iklan dari admin (ads.json) menggantikan kode bawaan di atas.
      (function () {
        var K = 'mlbb-academy:ads', S = ['home', 'skin', 'hero', 'detail', 'academy', 'esport', 'socialbar', 'popunder'];
        function apply(d) {
          if (!d || !d.slots) return;
          S.forEach(function (s) {
            var c = d.slots[s], t = document.getElementById('ad-' + s);
            if (!c || !t) return;
            t.innerHTML = c.on === false ? '' : (c.code || '');
            if (c.height) t.setAttribute('data-height', c.height);
          });
          var sp = d.slots.sponsor, st = document.getElementById('ad-sponsor');
          if (sp && st) {
            st.setAttribute('data-url', sp.on === false ? '' : (sp.url || ''));
            st.setAttribute('data-title', sp.title || '');
            st.setAttribute('data-text', sp.text || '');
          }
        }
        try { apply(JSON.parse(localStorage.getItem(K) || 'null')); } catch (e) {}
        fetch('ads.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (!d) return; try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} apply(d); window.dispatchEvent(new Event('ads-updated')); })
          .catch(function () {});
      })();
    </script>
